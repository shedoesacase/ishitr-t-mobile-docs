openapi: 3.0.3
info:
  title: Generator Service API
  description: Внутреннее API генератора. Используется для админ-панели самого генератора.
  version: 19.10.2026
servers:
  - url: http://localhost:8080
  
paths:
  /api/v1/generator/time:
    get:
      summary: Получить текущий статус времени
      description: Возвращает текущее реальное время, виртуальное время системы, текущий множитель ускорения и статус паузы.
      tags:
        - Управление временем
      responses:
        '200':
          description: Успешный ответ со статусом времени
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeStatus'
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/generator/time/accelerate:
    post:
      summary: Ускорение времени на заданный коэффициент
      description: Ускоряет класическое время в заданный множитель
      tags: 
        - Управление временем
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/TimeAccelerateRequest'
      responses: 
        '200':
          description: Время ускорено
          content:
            application/json: 
              schema: 
                $ref: '#/components/schemas/TimeStatus'
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/generator/time/reset:
    post:
      summary: Возвращает время к классической скорости
      tags:
        - Управление временем
      responses: 
        '200':
          description: Время успешно сброшено до стандартного
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/TimeStatus'
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/generator/time/pause:
    post:
      summary: Останавливает течение времени в симуляции
      tags:
        - Управление временем
      responses: 
        '200':
          description: Время успешно остановлено
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/TimeStatus'
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/generator/time/resume:
    post:
      summary: Возобновляет течение времени в симуляции
      tags:
        - Управление временем
      responses: 
        '200':
          description: Течение времени успешно возобновлено
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/TimeStatus'
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/generator/events/background/user/start:
    post:
      summary: Запуск фонового потока генерации данных для отдельного пользователя
      tags:
        - События
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBackgroundStartRequest'
      responses:
        '201':
          description: Поток успешно запущен
        '409':
          description: Поток уже запущен
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/generator/events/background/user/stop:
    post:
      summary: Остановка фонового потока генерации данных для отдельного пользователя
      tags:
        - События
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBackgroundStopRequest'
      responses:
        '201':
          description: Поток успешно остановлен
        '409':
          description: Поток уже был остановлен
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера


  /api/v1/generator/events/anomaly/user/start:
    post:
      summary: Запуск аномального скачка потребления для отдельного пользователя
      description: Аномальный скачок потребления длится 6 виртуальных часов и, по истечении 6 часов, должен израсходовать заданное количество ресурса. Скорость расхода равна отношению объема требуемого расхода к 6. В случае, если ресурса меньше, чем задано (в запросе 15%, а по факту 10%), скорость сохраняется и событие автоматически останавливается по достижению конца трафика.
      tags:
        - События
      requestBody:
        required: true
        content:
          application/json: 
            schema: 
              $ref: '#/components/schemas/UserAnomalyStartRequest'
      responses: 
        '201':
          description: Скачок запущен
        '409':
          description: Скачок уже был запущен
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/generator/events/anomaly/user/stop:
    post:
      summary: Остановка аномального скачка потребления для отдельного пользователя
      description: Останавливает событие в момент его активности, не отменяет последствия события.
      tags:
        - События
      requestBody:
        required: true
        content:
          application/json: 
            schema: 
              $ref: '#/components/schemas/UserAnomalyStopRequest'
      responses: 
        '201':
          description: Скачок остановлен
        '409':
          description: Скачок уже был остановлен
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера
  
  /api/v1/generator/events/background/all/start:
    post:
      summary: Запуск массовой фоновой генерации для всех пользователей
      description: Запускает фоновую генерацию одновременно для всех активных пользователей в системе.
      tags:
        - События
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllUsersBackgroundStartRequest'
      responses:
        '200':
          description: Массовая генерация успешно обработана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassGenerationStartResponse'
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

components:
  schemas:
    TimeStatus:
      type: object
      required: 
        - real_time
        - virtual_time
        - multiplier
        - is_paused
      properties: 
        real_time:
          type: string
          format: date-time
          description: Текущие реальные дата и время
          example: "2026-10-16T10:00:00+03:00"
        virtual_time:
          type: string
          format: date-time
          description: Текущее виртуальное время внутри системы
          example: "2026-11-20T15:30:00+03:00"
        multiplier: 
          type: integer
          description: Множитель времени (может быть только положительным)
          minimum: 1
          example: 1000
        is_paused:
          type: boolean
          description: Флаг паузы симуляции генерации событий
          example: false

    UserBackgroundStartRequest:
      type: object
      required:
        - user_id
        - resource_type
        - mode
      properties:
        user_id:
          type: integer
        resource_type:
          type: string
          enum: [TRAFFIC, MINUTES]
        mode:
          type: string
          enum: [SIMPLE, REALISTIC]
          description: Режим генерации. SIMPLE - через фиксированный интервал. REALISTIC - по суточному профилю потребления.
        interval_seconds:
          type: integer
          description: Интервал между событиями в секундах (используется только в режиме SIMPLE)
          example: 60
        profile_type:
          type: string
          enum: [STANDARD, CUSTOM, TRIP]
          description: Профиль для REALISTIC режима. TRIP имитирует минимальное потребление (поездка/роуминг).
        custom_profile:
          type: array
          items:
            type: number
            minimum: 0
            maximum: 1
          minItems: 24
          maxItems: 24
          description: Коэффициенты потребления для каждого из 24 часов суток (только для CUSTOM)

    UserBackgroundStopRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer

    UserAnomalyStartRequest:
      type: object
      required: 
        - user_id
        - resource_type
      properties: 
        user_id:
          type: integer
        resource_type:
          type: string
          enum: [TRAFFIC, MINUTES]
        
    UserAnomalyStopRequest:
      type: object
      required: 
        - user_id
      properties: 
        user_id:
          type: integer

    TimeAccelerateRequest:
      type: object
      required: 
        - multiplier
      properties: 
        multiplier:
          type: integer
          minimum: 1
          description: Множитель стандартного времени (не текущего). Предположим, текущее время в системе ускорено в 5 раз. Данный множитель означает, что при передаче 10, система будет ускорена в 10 раз по сравнению со стандартным временем, а не в 50.

    AllUsersBackgroundStartRequest:
      type: object
      required:
        - resource_type
        - mode
      properties:
        resource_type:
          type: string
          enum: [TRAFFIC, MINUTES]
        mode:
          type: string
          enum: [SIMPLE, REALISTIC]
        interval_seconds:
          type: integer
          description: Интервал между событиями в секундах. Обязательно, если mode = SIMPLE.
          minimum: 1
          example: 60
        profile_type:
          type: string
          enum: [STANDARD, TRIP]
          description: Профиль для REALISTIC режима. TRIP имитирует минимальное потребление (поездка/роуминг).

    MassGenerationStartResponse:
      type: object
      description: Результат попытки запуска массовой генерации
      properties:
        total_active_users:
          type: integer
          description: Общее количество активных пользователей, найденных в системе
          example: 10
        started_count:
          type: integer
          description: Количество пользователей, для которых генерация была успешно запущена
          example: 7
        ignored_count:
          type: integer
          description: Количество пользователей, которые были проигнорированы, так как у них уже есть активная генерация (фоновая или аномалия)
          example: 3
        message:
          type: string
          description: Человеко-читаемое сообщение для отображения в UI (toast)
          example: "Массовая генерация запущена для 7 пользователей. 3 пользователя проигнорированы (уже активны)."