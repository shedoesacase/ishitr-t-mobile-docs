openapi: 3.0.3
info:
  title: Backend Core API
  description: Основной API бэкэнда.
  version: 19.10.2026
servers:
  - url: http://localhost:8080

paths:
  /api/v1/tariffs:
    post:
      summary: Создать новый тариф
      tags:
        - Тарифы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePackageCreate'
      responses:
        '201':
          description: Тариф успешно создан
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

    get:
      summary: Получить список всех тарифов
      description: Возвращает массив всех тарифов с их названием и параметрами. Используется для отображения на дашборде генератора.
      tags:
        - Тарифы
      responses:
        '200':
          description: Успешный ответ со списком тарифов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePackage'
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/tariffs/{package_id}:
    get:
      summary: Получить один тариф по ID
      description: Возвращает данные конкретного тарифа по его идентификатору.
      tags:
        - Тарифы
      parameters:
        - name: package_id
          in: path
          required: true
          description: Уникальный идентификатор тарифа
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ с данными тарифа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePackage'
        '404':
          description: Тариф не найден
        '500':
          description: Внутренняя ошибка сервера


  /api/v1/users:
    post:
      summary: Создать нового тестового пользователя
      description: Регистрация нового пользователя. Вызывается мобильным приложением.
      tags:
        - Пользователи и Группы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации данных
        '409':
          description: Такой номер телефона уже зарегестрирован в системе
        '500':
          description: Внутренняя ошибка сервера
          
    get:
      summary: Получить список всех пользователей
      description: Возвращает массив всех зарегистрированных пользователей с информацией об их группах и ролях. Используется для отображения на дашборде генератора.
      tags:
        - Пользователи и Группы
      responses:
        '200':
          description: Успешный ответ со списком пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/users/{user_id}:
    get:
      summary: Получить одного пользователя по ID
      description: Возвращает данные конкретного пользователя по его идентификатору.
      tags:
        - Пользователи и Группы
      parameters:
        - name: user_id
          in: path
          required: true
          description: Уникальный идентификатор пользователя
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ с данными пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Пользователь не найден
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/groups:
    get:
      summary: Получить список всех семейных групп
      description: Возвращает массив всех созданных групп для отображения на дашборде.
      tags:
        - Пользователи и Группы
      responses:
        '200':
          description: Успешный ответ со списком групп
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyGroup'
        '500':
          description: Внутренняя ошибка сервера

    post:
      summary: Создать новую семейную группу
      description: Создает семейную группу с выбранным создателем и пользователями. Используется для мобильного приложения.
      tags:
        - Пользователи и Группы
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: Группа успешно создана
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyGroup'
        '400':
          description: Ошибка валидации данных
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/groups/{group_id}:
    get:
      summary: Получить одну семейную группу по ID
      description: Возвращает данные конкретной семейной группы по ее идентификатору.
      tags:
        - Пользователи и Группы
      parameters:
        - name: group_id
          in: path
          required: true
          description: Уникальный идентификатор группы
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ с данными группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyGroup'
        '404':
          description: Группа не найдена
        '500':
          description: Внутренняя ошибка сервера

components:
  schemas:
    User:
      type: object
      required:
        - user_id
        - phone_number
      properties:
        user_id:
          type: integer
          description: Уникальный идентификатор пользователя
          example: 123
        phone_number:
          type: string
          description: Номер телефона в международном формате
          example: "+79991234567"
        group_id:
          type: integer
          nullable: true
          description: ID группы, если пользователь состоит в группе. Null, если не состоит.
          example: 100
        role:
          type: string
          enum: 
            - OWNER
            - MEMBER
          nullable: true
          description: Роль в группе. Null, если не состоит в группе.
          example: OWNER
        status:
          type: string
          enum: 
            - ACTIVE
            - LEAVE
            - EXCLUDED
          nullable: true
          description: Статус участия в группе. Null, если не состоит в группе.
          example: ACTIVE

    UserCreate:
      type: object
      required: 
        - phone_number
      properties: 
        phone_number:
          type: string
          description: Номер телефона в международном формате для создания пользователя
          example: "+79990000001"

    FamilyGroup:
      type: object
      required: 
        - group_id
        - status
        - created_at
        - members_count
        - owner_id
      properties: 
        group_id:
          type: integer
          example: 100
        owner_id:
          type: integer
          description: ID пользователя-владельца группы (FK на User)
          example: 123
        status:
          type: string
          enum: 
            - ACTIVE
            - DISBANDED
          example: ACTIVE
        created_at:
          type: string
          format: date-time
          description: Дата и время создания группы
          example: "2026-10-13T20:43:31+03:00"
        members_count:
          type: integer
          description: Количество участников в группе (от 1 до 5, включая владельца, согласно BR-11)
          minimum: 2
          maximum: 4
          example: 3

    ServicePackage:
      type: object
      required: 
        - package_id
        - name
        - total_traffic
        - total_minutes
      properties: 
        package_id:
          type: integer
          example: 100
        name:
          type: string
          example: "Бюджетный"
        total_traffic:
          type: number
          format: double
          description: Общий объем трафика в ГБ
          minimum: 0
          example: 63.31
        total_minutes:
          type: integer
          description: Общий объем минут
          minimum: 0
          example: 455

    ServicePackageCreate:
      type: object
      required: 
        - name
        - total_traffic
        - total_minutes
      properties: 
        name:
          type: string
          example: "Бюджетный"
        total_traffic:
          type: number
          format: double
          description: Объем трафика в ГБ
          minimum: 0
          example: 63.31
        total_minutes:
          type: integer
          description: Объем минут
          minimum: 0
          example: 455

    GroupCreateRequest:
      type: object
      required: 
        - owner_id
        - member_ids
      properties: 
        owner_id:
          type: integer
          description: Айди пользователя, который будет выступать создателем в группе
        member_ids:
          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Список участников, которых можно добавить в группу
            